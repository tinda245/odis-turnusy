      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install chromium
      - run: python sledovani.py

  blok_4_hodiny_18_az_24:
    needs: blok_3_hodiny_12_az_18
    if: always()
