name: 24h Sledovani ODIS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blok_1_hodiny_0_az_6:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install chromium
      - run: python sledovani.py

  blok_2_hodiny_6_az_12:
    needs: blok_1_hodiny_0_az_6
    if: always()
